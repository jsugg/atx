[workspace]
members = ["xtask"]
resolver = "3"

[package]
name = "atx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reliable per-user command scheduler for macOS and Linux"
repository = "https://github.com/jsugg/atx"
readme = "README.md"
license = "MIT"
keywords = ["scheduler", "cli", "jobs", "timer", "automation"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/migrations/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "atx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
jiff = { version = "0.2.35", default-features = false, features = [
    "perf-inline",
    "serde",
    "std",
    "tz-fat",
    "tz-system",
    "tzdb-bundle-always",
] }
jiff-tzdb = "0.1.8"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
libc = "0.2.189"
clap_complete = "4"
clap_mangen = { version = "0.3.3", optional = true }

[features]
# Unlock the hidden `__man` export used by `cargo xtask dist-man`; never
# enabled for shipped builds.
man = ["dep:clap_mangen"]

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = true
strip = "symbols"
incremental = false
