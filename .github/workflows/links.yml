name: online links

on:
  pull_request:
    paths:
      - ".github/workflows/links.yml"
      - "scripts/check.sh"
      - "scripts/check-links.sh"
      - "scripts/test-links-harness.sh"
      - "**/*.md"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: tracked Markdown online links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.0
      - name: Install pinned link checker
        run: cargo install lychee --version 0.24.2 --locked
      - name: Exercise deterministic link regressions
        run: scripts/test-links-harness.sh --real
      - name: Check offline documentation links
        run: scripts/check.sh links-offline
      - name: Check online documentation links
        run: scripts/check.sh links-online
