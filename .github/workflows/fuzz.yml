name: fuzz

on:
  workflow_dispatch:
  schedule:
    # Nightly, after the main CI window; bounded so each target finishes fast.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # Fixed time budget per target instead of a run count: wall-clock budgets
  # are comparable across machines and libFuzzer versions.
  FUZZ_SECONDS: "300"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - duration
          - calendar
          - env_file
          - execution_persistence
          - ipc_frame
        # fuzz_targets/domain_shim.rs is a support module included by other
        # targets, not a runnable fuzz target: it has no fuzz_target! entry.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Dated nightly pin: floating nightly made runs irreproducible.
      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          rustup default nightly-2026-08-01
      # Prebuilt binary instead of a from-source `cargo install`, and the
      # fuzz workspace's build artifacts cached per target.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - name: Run ${{ matrix.target }}
        # The repo pins a stable toolchain via rust-toolchain.toml, which
        # overrides the `rustup default nightly` above. cargo-fuzz's default
        # musl target needs a musl std that the minimal profile lacks and is
        # incompatible with ASAN's crt-static requirement.
        #
        # The committed fuzz/seeds/<target> corpus gives every run a common
        # deterministic starting point instead of an empty dictionary.
        run: >-
          cargo +nightly-2026-08-01 fuzz run
          --target x86_64-unknown-linux-gnu
          "${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}"
          -- -max_total_time="${FUZZ_SECONDS}" -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 14
          if-no-files-found: ignore
