name: fuzz

on:
  workflow_dispatch:
  schedule:
    # Nightly, after the main CI window; bounded so each target finishes fast.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  FUZZ_RUNS: "20000"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - duration
          - calendar
          - env_file
          - execution_persistence
          - ipc_frame
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      # Prebuilt binary instead of a from-source `cargo install`, and the
      # fuzz workspace's build artifacts cached per target.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - name: Run ${{ matrix.target }}
        # The repo pins a stable toolchain via rust-toolchain.toml, which
        # overrides the `rustup default nightly` above.
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -runs="${FUZZ_RUNS}" -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 14
          if-no-files-found: ignore
