name: mutation

# Mutate the four pure domain modules named in the project plan. The unit-test
# filter keeps the run short; a whole-run timeout is reported separately.
on:
  workflow_dispatch:
  schedule:
    # Nightly, before the performance window.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  mutants:
    name: cargo-mutants critical modules
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned cargo-mutants
        run: cargo install --locked --version 25.3.1 cargo-mutants
      # Unit tests in this binary crate keep the pure-module campaign bounded.
      - name: Mutate critical modules under a time budget
        id: mutate
        run: |
          set +e
          timeout 45m cargo mutants --no-shuffle --timeout-multiplier 4 \
            -C '--locked' \
            --file src/domain/duration.rs \
            --file src/domain/calendar_syntax.rs \
            --file src/domain/recurrence.rs \
            --file src/domain/transition.rs \
            -v -- --bin atx 'domain::'
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 124 ]; then
            echo '::error::mutation campaign exceeded its 45-minute budget; no verdict was produced'
            exit 124
          fi
          if [ "$status" -ne 0 ]; then
            echo '::error::cargo-mutants reported surviving mutants; inspect the evidence artifact'
            exit "$status"
          fi
      - name: Record machine-readable evidence
        if: always()
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            cargo mutants --version
            printf 'scope=duration, calendar_syntax, recurrence, transition\n'
            printf 'exit_code=%s\n' "${{ steps.mutate.outputs.exit_code || 'not-run' }}"
            date -u +"timestamp=%Y-%m-%dT%H:%M:%SZ"
          } | tee mutant-evidence.txt
          test -d mutants.out
          tar czf mutants-report.tgz mutants.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-evidence
          path: |
            mutant-evidence.txt
            mutants-report.tgz
          retention-days: 90
          if-no-files-found: error
