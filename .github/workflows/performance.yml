name: performance

# Release-profile performance evidence. Correctness suites run in debug in
# ci.yml/platform.yml; this job is the only place the documented budgets are
# measured the way a released binary runs.
on:
  workflow_dispatch:
  schedule:
    # Nightly, after the platform window.
    - cron: "47 4 * * *"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  budgets:
    # Fixed hardware class so numbers stay comparable across runs.
    name: release-profile budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The 10k-job submission/list budget test asserts its own timing only
      # under --release; in debug it returns early, which is why this job is
      # separate from the debug correctness suites.
      - name: Submission and list budget (release profile)
        run: >-
          cargo test --release --locked
          infrastructure::sqlite::job_store::tests::ten_thousand_jobs_meet_submission_and_list_budgets
          -- --exact --nocapture
      - name: Record machine-readable evidence
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'profile=release\n'
            printf 'runner=%s\n' "${{ runner.name }}"
            date -u +"timestamp=%Y-%m-%dT%H:%M:%SZ"
          } | tee budget-evidence.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-evidence
          path: budget-evidence.txt
          retention-days: 90
          if-no-files-found: error
