name: security

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
  schedule:
    # Weekly, Monday morning.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: cargo audit + deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
      - name: Install audit tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  package-secrets:
    name: package content secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Scan packaged crate for secret-shaped strings
        run: |
          cargo package --no-verify --locked --allow-dirty
          crate=$(echo target/package/atx-*.crate)
          tar -xzf "$crate" -C target/package
          if grep -rInE '(api[_-]?key|secret|passw(or)?d|token)[[:space:]]*=[[:space:]]*"[A-Za-z0-9+/=_-]{16,}"' target/package/atx-*/ --include='*.rs' --include='*.toml'; then
            echo "secret-shaped string found in package" >&2
            exit 1
          fi
