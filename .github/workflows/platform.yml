name: platform

on:
  push:
    branches: [main]
    paths:
      - "src/infrastructure/**"
      - "src/run_monitor/**"
      - "src/supervisor/**"
      - "src/main.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "src/infrastructure/**"
      - "src/run_monitor/**"
      - "src/supervisor/**"
      - "src/main.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/platform.yml"
  schedule:
    # Nightly, after the main CI window.
    - cron: "3 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            tests: full
          - name: linux-x86_64-glibc
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            tests: full
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            tests: smoke
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --all-features --locked --target ${{ matrix.target }}
      - name: Smoke test binary
        run: |
          cargo run --quiet --locked --target ${{ matrix.target }} -- version
          cargo run --quiet --locked --target ${{ matrix.target }} -- --help >/dev/null
      - name: Full test suite
        if: matrix.tests == 'full'
        run: cargo test --all-targets --all-features --locked --target ${{ matrix.target }}

  cross-check:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          key: ${{ matrix.target }}
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Compile-only check
        run: >
          cargo check --all-targets --all-features --locked
          --target ${{ matrix.target }}
          --config "target.aarch64-unknown-linux-gnu.linker='aarch64-linux-gnu-gcc'"
          --config "target.aarch64-unknown-linux-musl.linker='aarch64-linux-gnu-gcc'"
