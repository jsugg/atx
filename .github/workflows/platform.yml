name: platform

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, after the main CI window.
    - cron: "3 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  linux-root:
    name: linux-x86_64-root
    runs-on: ubuntu-24.04
    container: rust:1.97-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test tools
        run: apt-get update && apt-get install -y --no-install-recommends procps sqlite3
      - name: Full test suite as root
        run: cargo test --all-targets --all-features --locked

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            tests: full
          # Native Intel runner, so x86_64-apple-darwin gets real coverage.
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            tests: full
          - name: linux-x86_64-glibc
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            tests: full
          # Native arm64 runner, so both aarch64 triples run their tests
          # instead of compile-only cross-checks.
          - name: linux-aarch64-glibc
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            tests: full
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            tests: full
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            tests: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --all-features --locked --target ${{ matrix.target }}
      - name: Smoke test binary
        run: |
          cargo run --quiet --locked --target ${{ matrix.target }} -- version
          cargo run --quiet --locked --target ${{ matrix.target }} -- --help >/dev/null
      - name: Full test suite
        if: matrix.tests == 'full'
        run: cargo test --all-targets --all-features --locked --target ${{ matrix.target }}

  cross-check:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # No aarch64-apple-darwin here: macos-15 runners are arm64, so the
      # native matrix job already builds and tests that triple directly.
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Compile-only check
        run: >
          cargo check --all-targets --all-features --locked
          --target ${{ matrix.target }}
          --config "target.aarch64-unknown-linux-gnu.linker='aarch64-linux-gnu-gcc'"
          --config "target.aarch64-unknown-linux-musl.linker='aarch64-linux-gnu-gcc'"

  busybox:
    # BusyBox is the minimal supported Linux userspace: a static musl binary
    # must run there (no glibc, no coreutils assumptions).
    name: busybox smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-busybox
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build static musl binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Smoke inside BusyBox
        run: >
          docker run --rm
          -v "$PWD/target/x86_64-unknown-linux-musl/release/atx:/atx:ro"
          -v "$PWD/.busybox-home:/home/smoke"
          --env HOME=/home/smoke --env TMPDIR=/tmp
          busybox:1.36.1-musl
          sh -c '/atx --version && /atx --state-dir /home/smoke/state doctor'
