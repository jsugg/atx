name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build (dry run: nothing is published)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight real release; a second tag push waits instead.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Dry run: the tag input only names what would be released; build the
        # dispatching ref itself (the tag usually does not exist yet).
      - name: Tag matches Cargo.toml version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          case "$ref" in
            v*) tag="${ref#v}" ;;
            *) echo "::error::tag must start with 'v' (got '$ref')"; exit 1 ;;
          esac
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  archives:
    name: archive ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64-musl
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The glibc aarch64 cross-compiler emits LFS/fortify symbols (open64,
      # __memcpy_chk, ...) that musl does not provide; link against the real
      # musl toolchain instead. platform.yml only cargo-checks this triple,
      # so it never sees the difference.
      - name: Install musl cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          curl -fsSL --retry 3 -o /tmp/musl.tar.gz \
            https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/aarch64-linux-musl-cross.tgz
          echo "c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38  /tmp/musl.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/musl-cross && sudo tar -xzf /tmp/musl.tar.gz -C /opt/musl-cross --strip-components=1
          echo "/opt/musl-cross/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" \
            >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --all-features --locked --target ${{ matrix.target }}
      # Cross-built arm64 binaries cannot exec on the x86_64 runner.
      - name: Install qemu user emulation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER=qemu-aarch64-static" \
            >> "$GITHUB_ENV"
      - name: Smoke test binary
        run: |
          bin="target/${{ matrix.target }}/release/atx"
          run=()
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            run=(qemu-aarch64-static)
          fi
          "${run[@]}" "$bin" --version | grep -qx "atx $(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          # doctor checks real directory ownership/mode, so point it at a
          # private scratch state dir with a writable runtime dir.
          export HOME="$PWD/.smoke-home" XDG_RUNTIME_DIR="$PWD/.smoke-runtime"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 0700 "$HOME" "$XDG_RUNTIME_DIR"
          "${run[@]}" "$bin" --state-dir "$HOME/state" doctor
      - name: Stage deterministic layout
        run: |
          install -m 0755 "target/${{ matrix.target }}/release/atx" atx
          # Reproducible archive: fixed mtime, root ownership (numeric, so
          # bsdtar and GNU tar agree), ustar format, gzip -n drops timestamp.
          # Verified byte-identical on rebuild.
          touch -t 197001010000 atx
          mkdir -p dist
          COPYFILE_DISABLE=1 tar --format ustar --numeric-owner --owner 0 --group 0 -c atx \
            | gzip -n -9 > "dist/atx-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz"
          rm atx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: archives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Real releases only on tag pushes; workflow_dispatch is a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Verify every expected archive is present
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -s "dist/atx-$ref-$target.tar.gz" || {
              echo "::error::missing archive for $target"; exit 1;
            }
          done
      - name: Publish draft release
        if: env.DRY_RUN == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            Prebuilt binaries for supported platforms. See `SHA256SUMS` for
            checksums; verify before use:

                sha256sum --check --ignore-missing SHA256SUMS
