name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build (dry run: nothing is published)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Cargo.toml version
        env:
          TAG_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          ref="$TAG_REF"
          case "$ref" in
            v*) tag="${ref#v}" ;;
            *) echo "::error::tag must start with 'v' (got '$ref')"; exit 1 ;;
          esac
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  archives:
    name: archive ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            # Native Intel runner, so the smoke test runs without Rosetta.
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: linux-x86_64-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # Native runners with matching glibc, so no cross toolchain needed.
          - name: linux-aarch64-gnu
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Point cc-rs at the host musl wrappers
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=ar" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --all-features --locked --target ${{ matrix.target }}
      - name: Smoke test binary
        run: |
          bin="target/${{ matrix.target }}/release/atx"
          "$bin" --version | grep -qx "atx $(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          # doctor checks real directory ownership/mode, so point it at a
          # private scratch state dir with a writable runtime dir.
          export HOME="$PWD/.smoke-home" XDG_RUNTIME_DIR="$PWD/.smoke-runtime"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 0700 "$HOME" "$XDG_RUNTIME_DIR"
          "$bin" --state-dir "$HOME/state" doctor
      - name: Stage deterministic layout
        run: |
          install -m 0755 "target/${{ matrix.target }}/release/atx" atx
          # Reproducible archive: fixed mtime, root ownership (numeric, so
          # bsdtar and GNU tar agree), ustar format, gzip -n drops timestamp.
          # Verified byte-identical on rebuild.
          touch -t 197001010000 atx
          mkdir -p dist
          COPYFILE_DISABLE=1 tar --format ustar --numeric-owner --owner 0 --group 0 -c atx \
            | gzip -n -9 > "dist/atx-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz"
          rm atx
      - name: Generate CycloneDX SBOM for the binary
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          file: "dist/atx-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz"
          output-file: "dist/atx-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.cdx.json"
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.cdx.json
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: archives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Verify every expected archive and SBOM is present
        env:
          TAG_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          ref="$TAG_REF"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu aarch64-unknown-linux-musl; do
            test -s "dist/atx-$ref-$target.tar.gz" || {
              echo "::error::missing archive for $target"; exit 1;
            }
            test -s "dist/atx-$ref-$target.cdx.json" || {
              echo "::error::missing SBOM for $target"; exit 1;
            }
          done
      - name: Attest archives and SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh takes a single artifact per invocation, so loop over the globs.
          for f in dist/*.tar.gz dist/*.cdx.json; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY"
          done
      - name: Publish draft release
        if: env.DRY_RUN == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
          body: |
            Prebuilt binaries for supported platforms, with a CycloneDX SBOM
            per archive and build-provenance attestations. See
            docs/releasing.md for how to check checksums and attestations.
