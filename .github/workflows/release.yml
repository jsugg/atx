name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build (dry run: nothing is published)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TAG_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Build exactly the tagged bytes: without ref, a manual dispatch
        # would check out the default branch and label it as the tag.
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Tag matches Cargo.toml version and changelog section
        run: |
          ref="$TAG_REF"
          case "$ref" in
            v*) tag="${ref#v}" ;;
            *) echo "::error::tag must start with 'v' (got '$ref')"; exit 1 ;;
          esac
          manifest_version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest_version"
            exit 1
          fi
          # The crates.io workflow rejects an Unreleased-only changelog;
          # the release workflow must apply the same gate so GitHub assets
          # and crate metadata can never disagree.
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section"
            exit 1
          fi
          # Prove the checkout really is the tag before anything builds.
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "$ref^{commit}")"
          if [ "$head" != "$tagged" ]; then
            echo "::error::HEAD $head is not the tagged commit $tagged"
            exit 1
          fi
      - name: Extract release notes
        run: |
          ref="$TAG_REF"
          version="${ref#v}"
          # index() with a literal match: the section text goes through a
          # regex engine otherwise, and '[' there starts a character class,
          # so the old range pattern never matched and produced empty notes.
          awk -v version="$version" 'BEGIN { section = "## [" version "]" }
            index($0, section) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || {
            echo "::error::empty release notes for $version"; exit 1;
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  archives:
    name: archive ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            # Native Intel runner, so the smoke test runs without Rosetta.
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: linux-x86_64-gnu
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # Native runners with matching glibc, so no cross toolchain needed.
          - name: linux-aarch64-gnu
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TAG_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Point cc-rs at the host musl wrappers
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=ar" >> "$GITHUB_ENV"
      # Shipped binaries carry default features: the man feature exists for
      # packaging only and must not ship clap_mangen or the hidden __man
      # command inside released binaries.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Generate man pages for the archive
        run: cargo run --quiet --locked --features man -- __man man-pages
      - name: Smoke test binary
        run: |
          bin="target/${{ matrix.target }}/release/atx"
          "$bin" --version | grep -qx "atx $(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          # The shipped binary must not know the internal __man command.
          if "$bin" __man /tmp/should-not-exist >/dev/null 2>&1; then
            echo "::error::shipped binary exposes __man; all-features leaked in"
            exit 1
          fi
          # doctor checks real directory ownership/mode, so point it at a
          # private scratch state dir with a writable runtime dir.
          export HOME="$PWD/.smoke-home" XDG_RUNTIME_DIR="$PWD/.smoke-runtime"
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 0700 "$HOME" "$XDG_RUNTIME_DIR"
          "$bin" --state-dir "$HOME/state" doctor
      - name: Stage deterministic layout
        run: |
          install -m 0755 "target/${{ matrix.target }}/release/atx" atx
          # Reproducible archive: fixed mtime, root ownership (numeric, so
          # bsdtar and GNU tar agree), ustar format, gzip -n drops timestamp.
          touch -t 197001010000 atx
          find man-pages -type f -exec touch -t 197001010000 {} +
          touch -t 197001010000 LICENSE-MIT README.md CHANGELOG.md
          mkdir -p dist
          COPYFILE_DISABLE=1 tar --format ustar --numeric-owner --owner 0 --group 0 \
            -c atx LICENSE-MIT README.md CHANGELOG.md man-pages \
            | gzip -n -9 > "dist/atx-${TAG_REF}-${{ matrix.target }}.tar.gz"
          rm -rf atx man-pages
      - name: Inspect the archive like a consumer
        run: |
          archive="dist/atx-${TAG_REF}-${{ matrix.target }}.tar.gz"
          scratch=$(mktemp -d)
          tar -xzf "$archive" -C "$scratch"
          for member in atx LICENSE-MIT README.md CHANGELOG.md; do
            test -s "$scratch/$member" || {
              echo "::error::archive missing required member: $member"; exit 1;
            }
          done
          ls "$scratch"/man-pages/*.1 >/dev/null || {
            echo "::error::archive missing man pages"; exit 1;
          }
          chmod +x "$scratch/atx"
          HOME="$scratch/home" "$scratch/atx" version | grep -q "atx "
      - name: Generate CycloneDX SBOM for the archive
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          file: "dist/atx-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.tar.gz"
          output-file: "dist/atx-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.cdx.json"
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.cdx.json
          if-no-files-found: error

  finalize:
    name: checksums and attestation
    needs: archives
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Verify every expected archive and SBOM is present
        env:
          TAG_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          ref="$TAG_REF"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu aarch64-unknown-linux-musl; do
            test -s "dist/atx-$ref-$target.tar.gz" || {
              echo "::error::missing archive for $target"; exit 1;
            }
            test -s "dist/atx-$ref-$target.cdx.json" || {
              echo "::error::missing SBOM for $target"; exit 1;
            }
          done
          test -s "dist/RELEASE_NOTES.md" || {
            echo "::error::missing extracted release notes"; exit 1;
          }
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.cdx.json > SHA256SUMS
          cat SHA256SUMS
      - name: Attest archives and SBOMs
        if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
      - name: Verify attestations
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh takes a single artifact per invocation, so loop over the globs.
          for f in dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY"
          done
      - name: Upload checksum manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  draft-release:
    name: publish draft release
    needs: finalize
    # The only write-to-GitHub step runs in the protected environment, so
    # dry-run dispatches (workflow_dispatch) never touch it at all.
    if: github.event_name != 'workflow_dispatch'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
