name: publish-crates-io

# Publishing orchestration with two backends:
#
# - mock: every PR and every manual run rehearses the full publish flow
#   against a local registry mock (scripts/mock_registry.py) with dummy
#   credentials. Nothing leaves the runner.
# - crates-io: only on a published release, only while the repository
#   variable CRATES_IO_PUBLISH_ENABLED is exactly "true", and only inside
#   the protected `crates-io` environment. Until the owner enables both,
#   this job is skipped before any credential is requested.
#
# No crates.io token is stored anywhere; the real path uses short-lived
# trusted-publishing credentials via OIDC.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/publish-crates-io.yml"
      - "scripts/mock_registry.py"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  mock-publish:
    name: mock publish rehearsal
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Point cargo at the local registry mock
        run: |
          # Workspace-local config (not committed): a named registry whose
          # index and API live on loopback. The publish list is patched in
          # the working tree only, never committed.
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.atx-mock]
          index = "sparse+http://127.0.0.1:8192/index/"
          EOF
          sed -i 's/publish = \["crates-io"\]/publish = ["crates-io", "atx-mock"]/' Cargo.toml
      - name: Start local registry mock
        run: |
          python3 scripts/mock_registry.py 8192 "$RUNNER_TEMP" &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8192/index/config.json >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8192/index/config.json >/dev/null
      - name: Publish to the mock (dummy credential)
        env:
          CARGO_REGISTRIES_ATX_MOCK_TOKEN: dummy-not-a-real-token
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          # The registry-name sed patch leaves the tree dirty by design;
          # --allow-dirty is fine here and only here. The real crates.io
          # job below never patches and never allows it.
          cargo publish --registry atx-mock --locked --allow-dirty
          scripts/assert-mock-published.sh "$version" "$RUNNER_TEMP/requests.log"
      - name: Duplicate publish must fail
        env:
          CARGO_REGISTRIES_ATX_MOCK_TOKEN: dummy-not-a-real-token
        run: |
          if cargo publish --registry atx-mock --locked >/dev/null 2>&1; then
            echo "::error::duplicate publish unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Upload failures propagate nonzero
        run: |
          mkdir -p "$RUNNER_TEMP/failing"
          FAIL_UPLOADS=1 python3 scripts/mock_registry.py 8193 "$RUNNER_TEMP/failing" &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8193/index/config.json >/dev/null 2>&1 && break
            sleep 0.2
          done
          cat > .cargo/config.toml <<'EOF'
          [registries.atx-mock-fail]
          index = "sparse+http://127.0.0.1:8193/index/"
          EOF
          sed -i 's/"crates-io", "atx-mock"/"crates-io", "atx-mock", "atx-mock-fail"/' Cargo.toml
          if CARGO_REGISTRIES_ATX_MOCK_FAIL_TOKEN=dummy cargo publish --registry atx-mock-fail --locked >/dev/null 2>&1; then
            echo "::error::publish against failing registry unexpectedly succeeded" >&2
            exit 1
          fi

  crates-io:
    name: crates.io trusted publishing
    # Every guard sits in this condition so the job is skipped, and no
    # OIDC credential is requested, until the owner deliberately flips
    # both switches after CRATE-AUTH-GATE.
    if: >-
      github.event_name == 'release' &&
      vars.CRATES_IO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Tag, manifest, and changelog versions agree
        env:
          TAG_REF: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG_REF"
          case "$tag" in v*) tag="${tag#v}" ;; *) echo "::error::bad tag '$tag'"; exit 1 ;; esac
          manifest="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          test "$tag" = "$manifest" || { echo "::error::tag $tag != manifest $manifest"; exit 1; }
          grep -q "## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag] section"; exit 1; }
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-parse "$TAG_REF^{commit}")"
          test "$head" = "$tagged" || {
            echo "::error::HEAD $head is not the tagged commit $tagged"; exit 1;
          }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.97.0
      - name: Package and dry-run checks
        run: |
          cargo package --locked
          cargo publish --dry-run --locked
      - name: Refuse to republish an existing version
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          code="$(curl -fsS -o /dev/null -w '%{http_code}' \
            -A 'atx-release-ci (github.com/jsugg/atx)' \
            "https://crates.io/api/v1/crates/atx/$version/download" || true)"
          # A successful download means the version already exists.
          if [ "$code" = "200" ]; then
            echo "::error::atx $version already exists on crates.io"; exit 1
          fi
      - name: Request short-lived trusted-publishing credential
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Wait for the new version to be visible (bounded)
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)"
          for _ in $(seq 1 30); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' \
              -A 'atx-release-ci (github.com/jsugg/atx)' \
              "https://crates.io/api/v1/crates/atx/$version/download" || true)"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::atx $version not visible on crates.io within 5 minutes" >&2
          exit 1
