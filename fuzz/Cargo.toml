[package]
name = "atx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"

[[bin]]
name = "duration"
path = "fuzz_targets/duration.rs"
test = false
doc = false
bench = false

[workspace]
